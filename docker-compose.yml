# Start LuMi2d op je eigen server:  docker compose up -d --build
# Daarna te openen op http://<ip-van-de-server>:8080 (andere poort: LUMI2D_PORT=9000 docker compose up -d).
services:
  lumi2d:
    build: .
    image: lumi2d:latest
    container_name: lumi2d
    ports:
      - "${LUMI2D_PORT:-8080}:80"
    restart: unless-stopped
