# Controleert elke PR en elke push naar main: typecheck en productiebuild.
# Verplicht maken kan niet op een privérepo zonder GitHub Pro; daarom: pas mergen als deze check groen is.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
